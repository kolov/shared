name: Nightly

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Run label"
        required: false
        default: "manual"

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/run-tests.sh

  report:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - run: echo "nightly report generated"
