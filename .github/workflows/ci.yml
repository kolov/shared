name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f README.md

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [alpha, beta, gamma]
        mode: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - run: echo "building ${{ matrix.target }} in ${{ matrix.mode }}"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/run-tests.sh

  summary:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "pipeline complete for ${{ github.sha }}"
